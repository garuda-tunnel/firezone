apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "firezone"
  namespace: "garuda"
  labels:
    app.kubernetes.io/name: firezone
    app.kubernetes.io/instance: "firezone"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: garuda
    garuda.managed-by: helm
spec:
  parentRefs:
    - name: "platform-gateway"
      namespace: "gateway-system"
  hostnames:
    - "hub.example.net"
  rules:
    - backendRefs:
        - name: "firezone"
          port: 13000
