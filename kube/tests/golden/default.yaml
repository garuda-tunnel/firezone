# Source: firezone/templates/configmap-env.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: firezone-env
  namespace: "garuda"
  labels:
    app.kubernetes.io/name: firezone
    app.kubernetes.io/instance: "firezone"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: garuda
    garuda.managed-by: helm
data:
  # Non-secret Firezone Phoenix application env. Secret material (admin
  # password, encryption keys, WireGuard key, OIDC providers) lives in the
  # Terraform-owned Secret named by credentialsSecretName, never in values:
  # the helm provider prints the deployed release values unredacted in plans.
  EXTERNAL_URL: "https://hub.example.net"
  DEFAULT_ADMIN_EMAIL: "admin@example.net"
  WIREGUARD_IPV4_NETWORK: "198.51.100.128/25"
  WIREGUARD_IPV4_ADDRESS: "198.51.100.129"
  FZ_PORT: "13000"
  WIREGUARD_PORT: "51620"
  PHOENIX_SECURE_COOKIES: "true"
  TELEMETRY_ENABLED: "false"
  MAX_DEVICES_PER_USER: "100"
  WIREGUARD_IPV4_MASQUERADE: "false"
  WIREGUARD_IPV6_MASQUERADE: "false"
  # WireGuard server key: Firezone reads it from the file the wg-key volume
  # projects out of the credentials Secret (see deployment.yaml).
  WIREGUARD_PRIVATE_KEY_PATH: "/etc/firezone/wg/private_key"

