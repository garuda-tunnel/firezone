# Source: firezone/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "firezone"
  namespace: "garuda"
  labels:
    app.kubernetes.io/name: firezone
    app.kubernetes.io/instance: "firezone"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: garuda
    garuda.managed-by: helm
spec:
  # Recreate: WireGuard hostPort and the single server key require one server
  # pod at a time, including during replacement.
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: firezone
      app.kubernetes.io/instance: "firezone"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: firezone
        app.kubernetes.io/instance: "firezone"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/part-of: garuda
        garuda.managed-by: helm
      annotations:
        checksum/env-secret: 07b9e02d3b32216bcf78775fc8012bfc2ab6582417e7c6f781d3c7c1ac6a8250
    spec:
      restartPolicy: Always
      # Match the existing docker-compose stack's sysctls. All three are
      # flagged "unsafe" by upstream kubelet and must be allow-listed at
      # k3s install time via
      # `--kubelet-arg=allowed-unsafe-sysctls=net.ipv4.ip_forward,...`.
      # See examples/mini-site/infra/yc.tf module "k3s_init_hub" for the
      # operator-side wiring.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
          - name: net.ipv4.conf.all.rp_filter
            value: "2"
      volumes:
        # Disposable Phoenix state only (SAML self-signed cert, telemetry id).
        # The WireGuard server key lives in the env Secret, not here.
        - name: firezone-data
          emptyDir: {}
        # Required (no `optional`): a missing key keeps the pod from starting
        # instead of Firezone generating a replacement.
        - name: wg-key
          secret:
            secretName: firezone-env
            items:
              - key: WIREGUARD_PRIVATE_KEY
                path: private_key
            defaultMode: 0400
        - name: clamp-ready
          emptyDir: {}
      containers:
        - name: firezone
          image: "ghcr.io/garuda-tunnel/garuda-firezone:latest"
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_HOST
              valueFrom:
                secretKeyRef:
                  name: "postgres-app"
                  key: "host"
            - name: DATABASE_PORT
              valueFrom:
                secretKeyRef:
                  name: "postgres-app"
                  key: "port"
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: "postgres-app"
                  key: "dbname"
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: "postgres-app"
                  key: "username"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "postgres-app"
                  key: "password"
          envFrom:
            - secretRef:
                name: firezone-env
          ports:
            # Internal admin/Phoenix port. Backed by the ClusterIP
            # Service consumed by the Traefik IngressRoute.
            - name: admin-ui
              containerPort: 13000
              protocol: TCP
            # External WireGuard server endpoint. Exposed on the node
            # via hostPort so clients can reach it on the public IP of
            # the hub VM. Single-pod stack (Recreate strategy) means
            # there is no hostPort scheduling conflict.
            - name: wg
              containerPort: 51620
              hostPort: 51620
              protocol: UDP
          volumeMounts:
            - name: firezone-data
              mountPath: /var/firezone
            - name: wg-key
              mountPath: /etc/firezone/wg
              readOnly: true
            - name: clamp-ready
              mountPath: /var/lib/clamp
              readOnly: true
          readinessProbe:
            exec:
              command: ["sh", "-c", "test -f /var/lib/clamp/ready"]
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            capabilities:
              add: ["NET_ADMIN", "SYS_MODULE"]
        - name: mss-clamp
          # Empty image = reuse firezone image (ships nftables). Non-empty must be
          # digest-pinned; schema pattern "^$|@sha256:[a-f0-9]{64}$" enforces this.
          image: "ghcr.io/garuda-tunnel/garuda-firezone:latest"
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          volumeMounts:
            - name: clamp-ready
              mountPath: /var/lib/clamp
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Install MSS clamp in a SEPARATE table `inet firezone_mss`.
              # DQ1: Firezone only manages `table inet firezone`; it never does
              # `nft flush ruleset`, so our table survives its rewrites.
              # Idempotent: atomic create-then-flush-then-re-add in one nft -f - call.
              # NOT `set -eu` around the loop -- duplicate-add must not kill the sidecar.
              install_clamp() {
                nft -f - <<'NFTEOF'
              table inet firezone_mss {
                  chain forward {
                      type filter hook forward priority mangle; policy accept;
                      oifname "wg-firezone" tcp flags syn tcp option maxseg size set rt mtu
                      iifname "wg-firezone" tcp flags syn tcp option maxseg size set 1240
                  }
              }
              flush table inet firezone_mss
              table inet firezone_mss {
                  chain forward {
                      type filter hook forward priority mangle; policy accept;
                      oifname "wg-firezone" tcp flags syn tcp option maxseg size set rt mtu
                      iifname "wg-firezone" tcp flags syn tcp option maxseg size set 1240
                  }
              }
              NFTEOF
              }
              # One-shot install, signal readiness, then belt-and-braces existence check.
              install_clamp && touch /var/lib/clamp/ready
              while true; do
                nft list table inet firezone_mss >/dev/null 2>&1 || install_clamp
                sleep 300
              done

