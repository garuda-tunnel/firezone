namespace: garuda
name: firezone
databaseSecretName: postgres-app
serverFqdn: hub.example.net
clientSubnet: 198.51.100.128/25
wireguardIpv4Address: 198.51.100.129
wireguardIpv4Masquerade: false
wireguardIpv6Masquerade: false
wgListenPort: 51620
gatewayRef:
  name: platform-gateway
  namespace: gateway-system
nicAttach:
  - backbone
  - border
labels: {}
podLabels:
  net.garuda-tunnel/profile: oidc-guest
podAnnotations:
  net.garuda-tunnel/router-id: 198.51.100.22
images:
  firezone: ghcr.io/garuda-tunnel/garuda-firezone:latest
  oidcReconcile: python:3.12-slim-bookworm
adminEmail: admin@example.net
# The Terraform module always passes this (kube/main.tf); no chart default.
credentialsSecretName: firezone-credentials
ospf: null
oidc:
  managed: merge
  # Providers travel in the credentials Secret as OIDC_PROVIDERS_JSON
  # (written by kube/main.tf), never in chart values.
  enabled: true
mtuPolicy:
  mssClampEnabled: true
  fixedMss: 1240
