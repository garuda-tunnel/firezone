namespace: garuda
name: firezone
# Required: existing namespace-local Secret with host, port, dbname, username,
# password. Its role owns the database; the chart does not provision Postgres.
databaseSecretName: ""
# Required: consumer module supplies via var.server_fqdn. Empty default
# combined with values.schema.json minLength: 1 fails `helm install`
# fast when a deployment forgets to override.
serverFqdn: ""
# Required: consumer module supplies via var.client_subnet. Empty
# default fails fast (see schema minLength: 1).
clientSubnet: ""
# Required: derived from clientSubnet by the consumer module
# (cidrhost(var.client_subnet, 1)). Empty default fails fast.
wireguardIpv4Address: ""
wireguardIpv4Masquerade: false
wireguardIpv6Masquerade: false
wgListenPort: 51620
# Firezone telemetry phone-home (TELEMETRY_ENABLED, upstream default true).
# Disabled by default: a private VPN topology must not call out to
# ping.firez.one. Leaving it on produces a harmless but noisy
# `:nxdomain url=https://ping.firez.one` connectivity-check error in the
# firezone container logs because that endpoint has no public A/AAAA record.
telemetryEnabled: false
# Firezone MAX_DEVICES_PER_USER. Upstream (firezone 0.7.x, fz_http) defaults to
# 10 and hard-validates 0..100 in Config.Definitions; 100 is therefore the
# maximum reachable without patching the application image. Garuda deployments
# are small private topologies where the 10-device cap is the only thing users
# ever hit, so the chart opts into the upstream ceiling. Not threaded through
# the Terraform module on purpose -- same treatment as telemetryEnabled: an
# opinionated chart-level constant, not a per-stand knob.
maxDevicesPerUser: 100
# Required: consumer module supplies via var.gateway_ref. Both empty
# strings combined with the schema's minLength fail fast.
gatewayRef:
  name: ""
  namespace: ""
nicAttach:
  - backbone
  - border
labels: {}
podLabels: {}
podAnnotations: {}
images:
  firezone: ""
  oidcReconcile: ""
# Required: consumer module supplies via var.admin_email. Empty default
# fails fast.
adminEmail: ""
# Required: name of the Terraform-owned Secret (kube/main.tf
# kubernetes_secret_v1.credentials) carrying DEFAULT_ADMIN_PASSWORD, the six
# application encryption secrets, WIREGUARD_PRIVATE_KEY and (when OIDC is on)
# OIDC_PROVIDERS_JSON. No default: the name must come from the module, never
# from the chart, or the Deployment would reference a Secret nobody owns.
credentialsSecretName: ""
# ospf: null — kept for back-compat; ignored by chart (FRR sidecar removed
# in Phase 4+5 Decision #5; Garuda injects routing via annotation layer).
ospf: null
# OIDC reconcile. The module derives enabled from whether OIDC providers are
# configured (nonsensitive(length(var.oidc_providers) > 0)); the providers
# themselves travel in the credentials Secret as OIDC_PROVIDERS_JSON. When
# enabled is false, no sidecar / ConfigMap / shareProcessNamespace is
# rendered (OIDC off). When true, the oidc-reconcile sidecar reconciles
# providers onto the running instance.
oidc:
  managed: merge
  enabled: false
# MTU policy values — supplied by the consumer Terraform module.
# The mss-clamp sidecar, readiness probe, and outbound oifname route-PMTU rule
# are ALWAYS rendered. mssClampEnabled gates only the inbound iifname fixed-MSS
# rule (`iifname "wg-firezone" tcp option maxseg size set fixedMss`).
#   fixedMss: fixed MSS for the iifname (inbound) direction. Must be >= QUIC 1200 floor.
mtuPolicy:
  mssClampEnabled: true
  fixedMss: 1240
# MSS clamp sidecar — implementation knobs only (no policy values here).
# Always rendered. Installs a separate `table inet firezone_mss` (DQ1: Firezone
# never does `nft flush ruleset`, so this table survives independently). Provides:
#   oifname "wg-firezone" clamp-to-pmtu  -- LOAD-BEARING return clamp (Chain-B SYN-ACK), always active
#   iifname "wg-firezone" fixed MSS      -- defense for inbound-initiated flows, gated on mssClampEnabled
# Sidecar shares pod netns (NET_ADMIN), writes /var/lib/clamp/ready, gates firezone Ready.
mssClamp:
  # Sidecar image: empty => reuse the firezone container image (ships nftables).
  # Non-empty MUST be a digest-pinned ref (@sha256:<64-hex>). Floating tags rejected by schema.
  image: ""
  # DQ1: Firezone never global-flushes nft, so this is belt-and-braces only.
  # One-shot install on startup, then periodic existence-check (NOT reapply).
  checkIntervalSeconds: 300
